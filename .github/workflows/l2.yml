name: L2

# Merge-level gates from docs/14-quality-gates.md §4. C2 (INF-007) asked for G2.1–G2.8; this
# file is a second workflow on purpose: adding jobs here must not become a reason to skip,
# filter, or continue-on-error the L1 verify suite in ci.yml.
#
# G2.1 is the L1 re-run, which ci.yml already does on main. This workflow is G2.8 (licenses),
# G2.7 (migrate up → down → up on sqlite), G2.2 (HTTP + file-backed sqlite), G2.6 (client ZIP /
# first-screen JS / empty files / debug symbols / test backdoors), G2.4 (Semgrep with the
# 14-security §2.1 custom rules, plus CodeQL security-extended), and G2.5 (Trivy filesystem
# SCA). G2.3 is still absent.

on:
  push:
    # Same branches as L1. Wave work is pushed for a long time before it is ever a pull request,
    # so a merge-level gate that only ran on main would discover a GPL dependency at the last
    # possible moment — the failure mode T0-1 already closed for L1.
    branches:
      - main
      - 'cursor/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: l2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: G2.8 licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: License whitelist
        run: pnpm run check:licenses

  migrate:
    name: G2.7 migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A down that does not drop a table, or an up-only file, exits 1. There is no
      # continue-on-error: a no-op rollback is a red merge-level gate, not a warning.
      - name: Migrate up, down, up
        run: pnpm run check:migrate

  integration:
    name: G2.2 sqlite integration
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # A :memory: path, an unset DATABASE_URL, or a postgres URL exits 1. There is no
      # continue-on-error: an in-memory bounce is a red merge-level gate, not a warning.
      - name: HTTP service against a sqlite file
        run: pnpm run check:integration

  artifact:
    name: G2.6 artifact budget
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build client
        run: pnpm --filter @minidrama/app build

      # An over-budget ZIP, a first-screen JS gzip over 300 KB, an empty file, a shipped
      # `.map`, or a debug/test backdoor exits 1. There is no continue-on-error: a comment
      # that the bundle "looks small" is a red merge-level gate, not a warning.
      - name: Client ZIP and first-screen JS budget
        run: pnpm run check:artifact

  sast:
    name: G2.4 SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Semgrep
        run: pip install 'semgrep==1.128.1'

      # A missing binary, a missing rules file, or a high finding exits 1. There is no
      # continue-on-error: grepping the tree instead of running Semgrep is not G2.4.
      - name: Semgrep custom rules
        run: pnpm run check:sast

  codeql:
    name: G2.4 CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install CodeQL
        env:
          CODEQL_BUNDLE_VERSION: 2.26.2
        run: |
          curl -sfL "https://github.com/github/codeql-action/releases/download/codeql-bundle-v${CODEQL_BUNDLE_VERSION}/codeql-bundle-linux64.tar.gz" -o /tmp/codeql.tgz
          mkdir -p /opt
          tar -xzf /tmp/codeql.tgz -C /opt
          echo /opt/codeql >> "$GITHUB_PATH"
          /opt/codeql/codeql version

      # A missing binary, a missing codescanning config, a suite with no queries, or a
      # high finding exits 1. There is no continue-on-error: grepping SARIF rule ids
      # instead of running CodeQL is not G2.4.
      - name: CodeQL security-extended
        run: pnpm run check:codeql

  sca:
    name: G2.5 SCA
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Trivy
        env:
          TRIVY_VERSION: 0.74.0
        run: |
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" -o /tmp/trivy.tgz
          tar -xzf /tmp/trivy.tgz -C /usr/local/bin trivy
          trivy version

      # A missing binary, a missing lockfile, a CRITICAL finding, or a HIGH finding with a
      # fix older than seven days exits 1. There is no continue-on-error: grepping CVE ids
      # instead of running Trivy is not G2.5.
      - name: Trivy filesystem SCA
        run: pnpm run check:sca
