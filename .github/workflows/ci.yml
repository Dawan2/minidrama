name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      # Runs after the build on purpose: the source rules and the HTML check need only the repo,
      # but the bundle scan needs the artifact that would actually be uploaded to the Portal.
      - name: Platform guardrails
        run: pnpm run check:guardrails

      # A generated file that has drifted from its source is a config bug that only shows up on
      # device, so regenerating and diffing is cheaper than trusting the committer.
      - name: Generated files are current
        run: |
          pnpm run gen:minis-config
          git diff --exit-code -- app/minis.config.json
