name: CI

on:
  push:
    # Wave branches are pushed for a long time before they ever become a pull request, so
    # restricting pushes to main means the work is unverified for exactly as long as it matters.
    branches:
      - main
      - 'cursor/**'
  pull_request:
  workflow_dispatch:

concurrency:
  # Push and pull_request refs are deliberately left in separate groups: sharing one would let a
  # branch push cancel the pull request's own check, which reads as a failed required check.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Diff coverage (G1.5) needs origin/main as the comparison base. A depth-1 clone
          # cannot see it, and a missing base must fail rather than report 100% of nothing.
          fetch-depth: 0

      - name: Fetch main for diff coverage
        run: git fetch origin main

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      # A missing binary, an empty tree, a thinning .gitleaks.toml, or a finding exits 1.
      # There is no continue-on-error: grepping AKIA instead of running Gitleaks is not G1.8.
      - name: G1.8 secrets
        run: pnpm run check:secrets

      - name: Install oasdiff
        env:
          OASDIFF_VERSION: 1.26.0
        run: |
          curl -sfL "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" -o /tmp/oasdiff.tgz
          tar -xzf /tmp/oasdiff.tgz -C /usr/local/bin oasdiff
          oasdiff -v

      # A missing binary, a missing spec, a thinning ignore file, or an ERR-level break exits 1.
      # There is no continue-on-error: grepping path strings instead of running oasdiff is not G1.6.
      - name: G1.6 contract compatibility
        run: pnpm run check:contract

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:coverage

      - name: Coverage
        run: pnpm run check:coverage

      - name: Build
        run: pnpm run build

      # Runs after the build on purpose: the source rules and the HTML check need only the repo,
      # but the bundle scan needs the artifact that would actually be uploaded to the Portal.
      - name: Platform guardrails
        run: pnpm run check:guardrails

      # A generated file that has drifted from its source is a config bug that only shows up on
      # device, so regenerating and diffing is cheaper than trusting the committer.
      - name: Generated files are current
        run: |
          pnpm run gen:minis-config
          git diff --exit-code -- app/minis.config.json
