<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Heiress Returns</title>
    <style>
      html,
      body {
        background: #0b0b0f;
        color: #f4f4f7;
      }
      a {
        color: #f4f4f7;
      }
    </style>
  </head>
  <body>
    <main data-testid="drama-page" data-state="ready">
      <a href="#/home">Back</a>
      <header data-testid="drama-header" data-drama-id="drm_test_0001">
        <div
          class="cover cover--missing"
          data-testid="cover-placeholder"
          role="img"
          aria-label="The Heiress Returns"
        >
          <span>Cover unavailable</span>
        </div>
        <h1>The Heiress Returns</h1>
        <p>
          <span data-testid="drama-category">REVENGE</span>
          <span>80 episodes</span>
          <span>Complete</span>
        </p>
        <p data-testid="free-badge">First 3 free</p>
        <p>She left with nothing. She came back owning the building.</p>
        <ul>
          <li>revenge</li>
          <li>billionaire</li>
        </ul>
        <a href="#/play/ep_test_0001" data-testid="watch-now">Watch now</a>
      </header>
      <section data-testid="episodes-section">
        <h2>Episodes</h2>
        <ul data-testid="episode-list">
          <li data-testid="episode-row" data-episode-id="ep_test_0001" data-action="PLAY">
            <span>Episode 1</span>
            <a href="#/play/ep_test_0001" data-testid="episode-action">Play</a>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
