<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wallet</title>
    <style>
      html,
      body {
        background: #0b0b0f;
        color: #f4f4f7;
      }
      a {
        color: #f4f4f7;
      }
    </style>
  </head>
  <body>
    <main data-testid="wallet-page" data-state="empty">
      <a href="#/me">Back</a>
      <h1>Wallet</h1>
      <section data-testid="wallet-balance" data-kind="KNOWN" data-pending="false">
        <p>0 coins</p>
      </section>
      <div data-testid="empty-state">
        <p>No activity yet.</p>
      </div>
      <p data-testid="wallet-recharge">
        <button type="button" disabled>Top up</button>
        <span>Top up is not available yet. Prices have not been set.</span>
      </p>
    </main>
  </body>
</html>
