rules:
  - id: ban-dangerously-set-inner-html
    message: >-
      14-security §2.1 forbids dangerouslySetInnerHTML. React JSX already escapes;
      unsanitized HTML is XSS. G2.4 high.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      gate: G2.4
      clause: 14-security §2.1 XSS
    pattern-either:
      - pattern: dangerouslySetInnerHTML={...}
      - pattern: |
          <$EL dangerouslySetInnerHTML=... />
      - pattern: |
          <$EL dangerouslySetInnerHTML=...>
          ...
          </>
      - pattern: '{ dangerouslySetInnerHTML: ... }'

  - id: ban-v-html
    message: >-
      14-security §2.1 forbids v-html. Unsanitized HTML is XSS. G2.4 high.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      gate: G2.4
      clause: 14-security §2.1 XSS
    pattern-either:
      - pattern: |
          <$EL v-html=... />
      - pattern: |
          <$EL v-html=...>
          ...
          </>
      - pattern-regex: \bv-html\s*=

  - id: ban-innerhtml-assignment
    message: >-
      14-security §2.1 forbids writing location, deeplink, or URL parameters into
      innerHTML / outerHTML / insertAdjacentHTML. G2.4 high.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      gate: G2.4
      clause: 14-security §2.1 DOM XSS
    pattern-either:
      - pattern: $EL.innerHTML = ...
      - pattern: $EL.outerHTML = ...
      - pattern: $EL.insertAdjacentHTML(...)

  - id: ban-document-write
    message: >-
      14-security §2.1 forbids document.write / writeln with attacker-controlled
      strings. G2.4 high.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      gate: G2.4
      clause: 14-security §2.1 DOM XSS
    pattern-either:
      - pattern: document.write(...)
      - pattern: document.writeln(...)

  - id: ban-eval
    message: >-
      14-security §2.1 forbids eval and the Function constructor. G2.4 high.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      gate: G2.4
      clause: 14-security §2.1 XSS
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
      - pattern: window.eval(...)
      - pattern: globalThis.eval(...)

  - id: ban-string-concat-sql
    message: >-
      14-security §2.1 requires parameterized queries. String-concatenated SQL is
      injection. G2.4 high.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      gate: G2.4
      clause: 14-security §2.1 SQL
    pattern-either:
      - pattern: $DB.exec($A + $B)
      - pattern: $DB.prepare($A + $B)
      - pattern: $DB.run($A + $B)
      - pattern: $DB.query($A + $B)
      - pattern: $DB.execute($A + $B)
      - pattern: $DB.all($A + $B)
      - pattern: $DB.get($A + $B)
      - pattern: $DB.exec(`...${$X}...`)
      - pattern: $DB.prepare(`...${$X}...`)
      - pattern: $DB.run(`...${$X}...`)
      - pattern: $DB.query(`...${$X}...`)
      - pattern: $DB.execute(`...${$X}...`)
      - pattern: $DB.all(`...${$X}...`)
      - pattern: $DB.get(`...${$X}...`)

  - id: ban-shell-concat
    message: >-
      14-security §2.1 forbids concatenating untrusted input into a shell command.
      G2.4 high.
    languages: [javascript, typescript]
    severity: ERROR
    metadata:
      gate: G2.4
      clause: 14-security §2.1 command injection
    pattern-either:
      - pattern: exec($A + $B)
      - pattern: execSync($A + $B)
      - pattern: spawn($A + $B, ...)
      - pattern: spawnSync($A + $B, ...)
      - pattern: execFile($A + $B, ...)
      - pattern: execFileSync($A + $B, ...)
      - pattern: $CP.exec($A + $B)
      - pattern: $CP.execSync($A + $B)
      - pattern: $CP.spawn($A + $B, ...)
      - pattern: $CP.spawnSync($A + $B, ...)
      - pattern: exec(`...${$X}...`)
      - pattern: execSync(`...${$X}...`)
      - pattern: spawn(`...${$X}...`, ...)
      - pattern: spawnSync(`...${$X}...`, ...)
      - pattern: $CP.exec(`...${$X}...`)
      - pattern: $CP.execSync(`...${$X}...`)
