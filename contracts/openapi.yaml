openapi: 3.1.0
info:
  title: Minidrama API
  version: 0.0.0
  description: |
    Wave 1 skeleton contract. This document is the single source of truth for the HTTP surface:
    the server validates against it and the client types are generated from it, so the two cannot
    drift (`docs/architecture/tech-stack.md` T13).

    Only the endpoints that exist in the skeleton are described here. The full surface is designed
    in `docs/12-api-contracts.md` and `docs/design/api-contracts.md`; endpoints move into this file
    as they are implemented, so a path in this document always has a running handler.

servers:
  - url: https://api.example.invalid
    description: Placeholder. Real domains are registered in the Portal and generated from
      packages/config/src/domains.ts.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [ops]
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1/playback/sessions:
    post:
      operationId: createPlaybackSession
      summary: Issue a playback descriptor for an episode
      description: |
        Returns the identifiers VePlayer needs. It does **not** return a media URL, a signed URL
        or a quality ladder — definition selection belongs to the player, and delivery belongs to
        BytePlus (correction A4, `docs/architecture/system-overview.md` §1.1).

        This endpoint owns the commercial gate only. The platform independently enforces
        moderation state, online version, listing state and client authorization, and may refuse
        an episode this endpoint approved.
      tags: [playback]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybackSessionRequest'
      responses:
        '201':
          description: The viewer is entitled; play with these identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackDescriptor'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          description: |
            The viewer is not entitled. `details.unlockOptions` drives the unlock panel. This is a
            commercial denial and must never be conflated with a platform block, which is an
            incident rather than a conversion opportunity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/search:
    get:
      operationId: searchDramas
      summary: Keyword search over drama titles and tags
      description: |
        Closes gap **G5** (`docs/02-information-architecture.md` §10), which is why the 剧场 tab's
        search entry exists but is hidden. Anonymous: browsing must work before login, and the
        Minis client's silent login can fail before the viewer has typed anything.

        Matching is over the title and the tags only, on a folded copy of both — case, fullwidth
        forms and Latin diacritics are folded, kana voiced marks are not. Results are ordered by
        match tier (title prefix, title substring, exact tag, partial tag), then by play count,
        then by identifier, which makes the order total and stable across requests.

        Only published dramas are returned. Unreviewed and delisted content is not discoverable
        (`docs/14-test-plan.md` §5.2, `E-13`).

        There is no cursor. Relevance order is not a keyset, so paging a ranking needs a snapshot
        of that ranking to mean anything; `truncated` says that more matched than `limit` allowed
        through, and the client's move is to narrow the query.
      tags: [discovery]
      parameters:
        - name: q
          in: query
          required: true
          description: |
            Required and non-empty. An empty query is a `400`, not an empty result set: "no results
            for nothing" is indistinguishable from a query that genuinely matched nothing, which is
            the one state the empty-result screen exists for.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: |
            An out-of-range limit is refused rather than clamped: a client that asks for 500 and
            silently receives 50 believes it has seen every match.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: The matches, ordered. Empty `items` is a normal answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DramaSearchResults'
        '400':
          $ref: '#/components/responses/Error'

  /v1/dramas/{dramaId}/favorite:
    parameters:
      - name: dramaId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    get:
      operationId: getDramaFavorite
      summary: Whether this viewer follows this drama
      description: |
        Answers `200` with `favorited: false` when they do not — the common case, and not an error.

        The read applies no publication check: a viewer must be able to see their own row for a
        drama that has since been delisted, because that row is why the drama is still on their
        favourites screen.

        `private, no-store`: the answer is per viewer, and a shared cache holding one is a
        cross-user leak waiting for a misconfigured proxy.
      tags: [discovery]
      security:
        - bearerSession: []
      responses:
        '200':
          description: This viewer's favourite state for this drama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: No verifiable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: addDramaFavorite
      summary: Follow a drama
      description: |
        Idempotent: a repeated `PUT` answers `204` and does **not** move `favoritedAt`. A
        double-tapped button and a retry after a network failure are the same single decision.

        This is the one operation here that consults the catalogue. Following a drama creates a
        reference to it, and a reference to something that does not exist reaches the viewer as a
        permanently broken card on their favourites screen. A drama that was never published
        answers `404` rather than `410`, so the endpoint cannot be used to confirm that an
        unannounced title exists.
      tags: [discovery]
      security:
        - bearerSession: []
      responses:
        '204':
          description: The viewer follows this drama. Empty body.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: No verifiable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such drama, or one that has never been published. `CONTENT_NOT_FOUND`, with
            `details.resourceType` and `details.resourceId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: |
            The drama has been delisted. `CONTENT_OFFLINE` — a viewer cannot start following
            content that is no longer served, though one who already follows it keeps the row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeDramaFavorite
      summary: Unfollow a drama
      description: |
        Idempotent and unconditional: `204` whether or not there was a row, and whatever the
        catalogue says about the drama. Un-following must never be the operation that fails —
        refusing it for a delisted drama would trap the row on the viewer's screen with no way to
        clear it, and a `404` for a row that is already gone makes a retried `DELETE` look like an
        error.
      tags: [discovery]
      security:
        - bearerSession: []
      responses:
        '204':
          description: The viewer does not follow this drama. Empty body.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: No verifiable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/progress/episodes/{episodeId}:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    put:
      operationId: reportEpisodeProgress
      summary: Report a watch position
      description: |
        Upsert of one `(viewer, episode)` position. Called on a heartbeat while playing and once on
        exit, so it is the highest-frequency authenticated endpoint in the product.

        Deliberately tolerant (`docs/12-error-catalog.md` §8). Conflicts between devices are
        resolved last-write-wins on `clientUpdatedAt`, and a report that loses is ignored and still
        answered `204`: it is not a client error, and reporting it as one would teach the client to
        retry a report it is right to have dropped.

        A position slightly past `durationSec` is clamped to it — the last `timeupdate` of an
        episode routinely lands a hair past the end. A position far past it is refused with
        `PROGRESS_INVALID_POSITION`, because clamping it would let one call mark any episode
        complete. `completed` is computed server-side from the ratio and a client-supplied
        `completed` is ignored.
      tags: [progress]
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchProgressReport'
      responses:
        '204':
          description: |
            The report was accepted. Empty body — the client already knows the position it sent, and
            the stored position may legitimately differ from it after a merge.
        '400':
          description: |
            `COMMON_VALIDATION_FAILED` names the offending field. `PROGRESS_INVALID_POSITION`
            carries `details.positionSec` and `details.durationSec`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            No verifiable session. One status and one code for a missing, rejected and unverifiable
            credential alike, so the endpoint is not an oracle. The client runs silent login and
            retries once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: getEpisodeResumePosition
      summary: Where this viewer should resume
      description: |
        Answers `200` with `resumePositionSec: 0` and `recorded: false` when the viewer has never
        watched the episode. A `404` would make the first play of every episode handle an error.

        The response is `private, no-store`: a resume position is per viewer, and a shared cache
        holding one is a cross-user leak waiting for a misconfigured proxy.
      tags: [progress]
      security:
        - bearerSession: []
      responses:
        '200':
          description: The viewer's position. `resumePositionSec` is the player's `startTime`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResumeView'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: No verifiable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      operationId: login
      summary: Exchange a TikTok authorization code for a session
      description: |
        `TTMinis.login()` yields a short-lived code on the client; the exchange happens server-side
        because a browser cannot call the OpenAPI directly (CORS) and because the client secret may
        never leave the server (U-03).

        Minis launches with `TIKTOK` only. The other providers in `docs/design/api-contracts.md` §5
        are reserved for future clients and are rejected here.

        The access token is opaque and short-lived. No refresh token is issued: the Minis client
        holds the access token in memory and re-runs silent login when it expires.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A session was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: |
            The platform rejected the authorization code — expired, already spent, or issued to
            another client key. The client answers by running silent login again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: |
            The identity provider could not be reached or is not configured. `AUTH_PROVIDER_ERROR`
            is ours to fix, not the caller's, and the response does not distinguish the two cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/callbacks/tiktok:
    post:
      operationId: receiveTiktokPaymentCallback
      summary: Inbound TikTok payment webhook
      description: |
        Server-to-server only; never called by a client. TikTok signs the request with
        `Tiktok-Signature: t=<epoch>,s=<hex>`, where the signed payload is
        `t + "." + <raw request body>` and the key is the client secret
        (`docs/research/tiktok-minis-official.md` §6.3).

        Verification is fail-closed and has no bypass. A request that cannot be authenticated —
        including one arriving at a deployment that holds no signing key — is rejected, and every
        verification failure answers with the same status and the same code so the endpoint cannot
        be used as an oracle.

        Delivery is at-least-once with 72 hours of retries, so a redelivery is normal traffic:
        it is deduplicated on `trade_order_id` and answered `200`. A non-200 is treated as failed
        delivery and brings the event back.

        The raw body is stored before it is parsed and before it is verified. The envelope field set
        is documented-but-not-exhaustive (gap G-R4), so the stored bytes are what makes a historical
        event replayable once the real field list is known.
      tags: [platform-tiktok]
      parameters:
        - name: Tiktok-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^t=[0-9]+,s=[0-9a-fA-F]{64}$'
          description: Sent by TikTok. `t` is UTC epoch seconds, `s` is the HMAC-SHA256 hex digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TiktokWebhookEnvelope'
      responses:
        '200':
          description: |
            The event was authenticated and accepted, or recognised as a redelivery. Returned
            immediately; fulfilment is not part of this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: |
            Rejected. `PAYMENT_CALLBACK_INVALID_SIGN` covers every authenticity failure without
            distinguishing them; `COMMON_VALIDATION_FAILED` means the request was authentic but its
            envelope could not be interpreted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/Error'

components:
  schemas:
    Health:
      type: object
      required: [status, service, uptimeSec]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        uptimeSec:
          type: integer
          minimum: 0

    CreatePlaybackSessionRequest:
      type: object
      required: [episodeId]
      properties:
        episodeId:
          type: string
          minLength: 1

    PlaybackDescriptor:
      type: object
      required: [albumId, episodeId, vid, resumePositionSec]
      properties:
        albumId:
          type: string
        episodeId:
          type: string
        vid:
          type: string
          description: BytePlus video id, produced by the platform media-asset pipeline.
        playAuthToken:
          type: string
          description: |
            Only required by TikTok clients below 44.5.0. Short-lived; fetched lazily and never
            cached beyond its validity.
        resumePositionSec:
          type: integer
          minimum: 0

    DramaSearchHit:
      type: object
      required: [dramaId, title, tags, matchedOn]
      description: |
        What search itself knows about a match, and nothing else. Cover art, episode counts and
        statistics are `DramaSummary` fields and are deliberately not duplicated here — a second,
        partial copy of a summary is how two shapes of one drama start disagreeing. The client
        renders a title-and-tags row today; the handoff records the field (`items[].drama`) that
        folds the real summary in.
      properties:
        dramaId:
          type: string
        title:
          type: string
          description: The stored title, verbatim. Matching runs on a folded copy nobody sees.
        tags:
          type: array
          items:
            type: string
        matchedOn:
          type: string
          enum: [TITLE, TAG]
          description: |
            Which field matched. Display information — a client may label a genre hit differently
            from a title hit — and also the primary sort key, so a client that ignores it still
            receives the rows in the order this says they are in.

    DramaSearchResults:
      type: object
      required: [query, items, truncated]
      properties:
        query:
          type: string
          description: |
            The query as searched: trimmed and whitespace-collapsed, in the viewer's own casing.
            Plain text in a JSON body and never HTML — search-term echo is on the XSS list in
            `docs/14-security.md` §2 precisely because it is so often rendered as markup.
        items:
          type: array
          items:
            $ref: '#/components/schemas/DramaSearchHit'
        truncated:
          type: boolean
          description: |
            True when more dramas matched than `limit` allowed through. There is no cursor; see the
            operation description.

    FavoriteState:
      type: object
      required: [dramaId, favorited]
      properties:
        dramaId:
          type: string
        favorited:
          type: boolean
        favoritedAt:
          type: string
          format: date-time
          description: |
            Server time when the favourite was *first* recorded. Absent when `favorited` is false,
            and unchanged by a repeated `PUT`: "following since" is a fact about the viewer's
            history, not about their most recent tap.

    WatchProgressReport:
      type: object
      required: [positionSec, durationSec, clientUpdatedAt]
      description: |
        The write shape. It says `positionSec` — an observation about the past — while the read says
        `resumePositionSec`, an instruction about the future and the same key the playback descriptor
        carries.
      properties:
        positionSec:
          type: integer
          minimum: 0
          description: Whole seconds. Clamped to `durationSec`; refused if far beyond it.
        durationSec:
          type: integer
          minimum: 1
          description: |
            The duration the player loaded. Sent with every report because the completion rule, the
            clamp and the refusal are all relations between the two values, and the asset's length is
            something the player knows and we do not.
        clientUpdatedAt:
          type: string
          format: date-time
          description: |
            The client's clock when the position was observed. The last-write-wins key: two devices
            are adjudicated on this rather than on arrival order, which is a property of the network.
            A value implausibly far in the future is pulled back to server time.
        completed:
          type: boolean
          deprecated: true
          description: |
            Accepted and ignored. Completion is computed server-side from the ratio; a client that
            could set it could inflate a completion metric.

    EpisodeResumeView:
      type: object
      required: [episodeId, resumePositionSec, completed, recorded]
      properties:
        episodeId:
          type: string
        resumePositionSec:
          type: integer
          minimum: 0
          description: |
            The player's `startTime`, and the same field name as in the playback descriptor. `0` when
            nothing was ever reported.
        completed:
          type: boolean
          description: |
            Server-computed from the position/duration ratio, and sticky: a rewatch does not clear it.
        recorded:
          type: boolean
          description: |
            False when this viewer never reported a position for this episode. It exists so that
            "never watched" and "watched, position 0" are distinguishable — a continue-watching entry
            point has to tell them apart to decide whether the episode belongs in the list at all.
        durationSec:
          type: integer
          minimum: 1
          description: From the last accepted report. Absent when `recorded` is false.
        updatedAt:
          type: string
          format: date-time
          description: Server time of the last accepted report. Absent when `recorded` is false.

    LoginRequest:
      type: object
      required: [provider, authCode]
      properties:
        provider:
          type: string
          enum: [TIKTOK]
        authCode:
          type: string
          minLength: 1
          description: |
            Single-use credential from `TTMinis.login()`. Never logged, never echoed, never stored.

    LoginResponse:
      type: object
      required: [accessToken, expiresInSec, openId]
      properties:
        accessToken:
          type: string
          description: Opaque and short-lived. The Minis client holds it in memory only.
        expiresInSec:
          type: integer
          minimum: 1
        openId:
          type: string
          description: |
            The TikTok user identifier and our user primary key. Stable, and scoped to the client
            key rather than to a region (U-04).

    TiktokWebhookEnvelope:
      type: object
      required: [client_key, event, create_time, user_openid, content]
      description: |
        TikTok's own envelope, in its own naming. Additional properties are permitted on purpose:
        the One Page documents `pay_type`, which appears in no public reference, so the field set is
        known to be incomplete (G-R4).
      additionalProperties: true
      properties:
        client_key:
          type: string
        event:
          type: string
          examples: [minis.trade_order.redeem.success]
        create_time:
          type: integer
          description: UTC epoch seconds.
        user_openid:
          type: string
        content:
          type: string
          description: |
            A serialised JSON *string*, not an object. Parsed separately from the envelope, so a
            `content` we cannot interpret does not invalidate a signature we already verified.

    WebhookAck:
      type: object
      required: [received, duplicate]
      properties:
        received:
          type: boolean
          const: true
        duplicate:
          type: boolean
          description: True when this delivery repeated an event already claimed.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code:
              type: string
            message:
              type: string
            traceId:
              type: string
              description: Echoed so a user report maps to a server trace.
            details:
              type: [object, 'null']
              additionalProperties: true

  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: |
        The opaque session token from `POST /v1/auth/login`, as `Authorization: Bearer <token>`. It
        is not a JWT and carries no claims: the mapping from token to user is the server's, so a
        token cannot be constructed. Declared on the endpoints that are per-viewer; endpoints without
        it either serve everyone the same answer or enforce their own rule.

  responses:
    Error:
      description: The request failed. The envelope is identical for every error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
