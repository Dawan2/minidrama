openapi: 3.1.0
info:
  title: Minidrama API
  version: 0.0.0
  description: |
    Wave 1 skeleton contract. This document is the single source of truth for the HTTP surface:
    the server validates against it and the client types are generated from it, so the two cannot
    drift (`docs/architecture/tech-stack.md` T13).

    Only the endpoints that exist in the skeleton are described here. The full surface is designed
    in `docs/12-api-contracts.md` and `docs/design/api-contracts.md`; endpoints move into this file
    as they are implemented, so a path in this document always has a running handler.

    **Cross-origin access applies to every path below.** The client bundle is served by TikTok, so
    the API is never the page's own origin and every browser call is a cross-origin call. A request
    carrying an `Origin` header that is not on the server's configured allowlist is refused with
    `403 COMMON_ORIGIN_NOT_ALLOWED` before routing — the response is the standard error envelope
    and carries no `Access-Control-*` header — and the browser's `OPTIONS` preflight is answered by
    the server rather than by any operation described here. There is no wildcard: an unconfigured
    deployment allows no browser origin at all, which is an outage for the client and never a
    quietly open API. Credentials are never allowed; the session is the `Authorization` header the
    client attaches itself. `Idempotency-Key`, `Authorization` and `Content-Type` are the
    non-safelisted request headers a preflight may ask for.

servers:
  - url: https://api.example.invalid
    description: Placeholder. Real domains are registered in the Portal and generated from
      packages/config/src/domains.ts.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags: [ops]
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /v1/playback/sessions:
    post:
      operationId: createPlaybackSession
      summary: Issue a playback descriptor for an episode
      description: |
        Returns the identifiers VePlayer needs. It does **not** return a media URL, a signed URL
        or a quality ladder — definition selection belongs to the player, and delivery belongs to
        BytePlus (correction A4, `docs/architecture/system-overview.md` §1.1).

        This endpoint owns the commercial gate only. The platform independently enforces
        moderation state, online version, listing state and client authorization, and may refuse
        an episode this endpoint approved.

        The entitlement verdict is the one produced by `POST /v1/entitlement/episode-access`, from
        the same facts. The two endpoints differ in what they do with it, not in what it says:
        that one reports state a client renders an unlock panel from, this one is an attempt and
        refuses. A denial resolves no media identifier at all — the video id is not withheld from
        the response, it is never looked up.

        Authentication is optional only in the sense that a free episode plays without it. An
        anonymous attempt on a paid episode is `401`, not `403`: signing in is the step that has
        to happen first (`docs/12-api-contracts.md` §4.4).
      tags: [playback]
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: '`Bearer <accessToken>`. Omit only for a free episode.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybackSessionRequest'
      responses:
        '201':
          description: The viewer is entitled; play with these identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackDescriptor'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: |
            `AUTH_REQUIRED`. The credential could not be read or resolved, or an anonymous viewer
            attempted a paid episode. In the last case `details` still carries the unlock context,
            so the client can offer sign-in and the unlock in one step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: |
            The viewer is not entitled. `EPISODE_LOCKED` when the episode can be bought,
            `EPISODE_VIP_REQUIRED` when it cannot; `details` carries `unlockPolicy`,
            `unlockOptions` and `priceCoins` and drives the unlock panel. This is a commercial
            denial and must never be conflated with a platform block, which is an incident rather
            than a conversion opportunity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `CONTENT_NOT_FOUND`. The episode does not exist, or it — or its season or drama — is
            not published. Draft content is reported as absent rather than as withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: '`CONTENT_OFFLINE`. The episode, its season or its drama has been withdrawn.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `COMMON_SERVICE_UNAVAILABLE` when entitlement state could not be established — no data
            layer, an unresolvable session, or a paid episode whose price is unusable.
            `EPISODE_ASSET_UNAVAILABLE` when the viewer is entitled and the media asset cannot be
            named: transcoding, or a storage fault. The second is never reported as a lock, which
            would invite an entitled viewer to pay again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/entitlement/episode-access:
    post:
      operationId: describeEpisodeAccess
      summary: Decide whether a viewer may play an episode
      description: |
        The single server-side answer to "may this viewer play this episode, and if not, what would
        change that". `docs/12-api-contracts.md` §3.3 forbids the client from deriving playability,
        so this is where it is derived.

        A commercial denial answers `200` with `viewerAccess.playable: false`: this endpoint reports
        state and the client needs the state to render an unlock panel. Playback is the enforcement
        point, and answers `403 EPISODE_LOCKED` for the same episode. Content that is unpublished or
        withdrawn has no viewer-facing state and uses the error envelope instead.

        Two ordering properties are part of the contract. A durable unlock (`COIN`, `AD`, `GRANT`) is
        consulted **before** VIP, so a subscription lapse cannot revoke separately paid access, and a
        `VIP`-method unlock row is a viewing receipt rather than a purchase. The drama-level free
        window is measured on the episode's position within the **drama**, not within its season.

        The response carries no media identifier of any kind. Playback identifiers come from
        `POST /v1/playback/sessions` (correction A4, `docs/architecture/system-overview.md` §1.1).

        Authentication is optional: a request with no credential is answered as a signed-out,
        non-VIP viewer holding nothing. A credential that cannot be read or resolved is refused
        rather than downgraded to anonymous.
      tags: [entitlement]
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
          description: '`Bearer <accessToken>`. Omit for an anonymous view.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EpisodeAccessRequest'
      responses:
        '200':
          description: The decision, including denials that the viewer can act on.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeAccessResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: |
            `AUTH_REQUIRED`. The credential could not be read, or names a user that does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `CONTENT_NOT_FOUND`. The episode does not exist, or it — or its season or drama — is not
            published. Draft content is reported as absent rather than as withdrawn, so the response
            does not confirm the existence of unpublished content.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: '`CONTENT_OFFLINE`. The episode, its season or its drama has been withdrawn.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `COMMON_SERVICE_UNAVAILABLE`. Entitlement state could not be established — no data layer,
            an unresolvable session, or a paid episode whose price is unusable. The decision denies
            rather than guessing, because both guesses cost money.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/unlock/coin-orders:
    post:
      operationId: createCoinUnlockOrder
      summary: Open a coin unlock order for an episode
      description: |
        Records the *intent* to buy an episode and returns the platform trade order the client hands
        to `TTMinis.pay`. It does not unlock anything: the same viewer asking
        `POST /v1/entitlement/episode-access` about the same episode immediately afterwards still
        gets `NEED_UNLOCK`, and `unlockGranted` is `false` on the response.

        An order leaves `PENDING` only when the signed TikTok callback
        (`POST /v1/payments/callbacks/tiktok`) confirms the payment. There is no endpoint, header or
        flag that advances an order, and a callback whose signature does not verify leaves every
        order exactly where it was.

        The price is the server's. The request body carries an episode id and nothing else, and the
        amount frozen onto the order is the one the entitlement decision quoted for this viewer at
        this moment. An episode that is free, already unlocked, covered by the viewer's subscription
        or purchasable only with a subscription is refused rather than sold.

        `Idempotency-Key` is required (`docs/12-api-contracts.md` §2.4). A repeat of the same key by
        the same viewer for the same episode returns the first order rather than opening a second
        payment; the same key for a different episode is a conflict.
      tags: [unlock]
      parameters:
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: '`Bearer <accessToken>`. An order has to belong to an account.'
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Reused verbatim when retrying, so a retry cannot open a second payment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCoinUnlockOrderRequest'
      responses:
        '201':
          description: |
            A `PENDING` order. Pay it with `TTMinis.pay`, then poll the order until it reports
            `unlockGranted: true`. Also returned for a replayed `Idempotency-Key`, which yields the
            original order unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinUnlockOrder'
        '400':
          description: |
            `COMMON_VALIDATION_FAILED` when `episodeId` is missing;
            `COMMON_IDEMPOTENCY_KEY_REQUIRED` when the header is absent, blank, over-long or sent
            more than once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            `AUTH_REQUIRED`. No credential, or one that could not be read or resolved. An order is
            attributed to an account, so this is refused before a price is quoted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`CONTENT_NOT_FOUND`. The episode does not exist or is not published.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `UNLOCK_ALREADY_UNLOCKED` when the viewer already owns the episode;
            `COMMON_IDEMPOTENCY_CONFLICT` when the key was used for a different episode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: '`CONTENT_OFFLINE`. The episode, its season or its drama has been withdrawn.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `UNLOCK_POLICY_NOT_ALLOWED`. There is nothing to sell: the episode is free, the viewer's
            subscription already covers it, or it is VIP-only and no quantity of coins opens it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `PAYMENT_CHANNEL_UNAVAILABLE` when no platform trade order could be created — including
            a deployment with no payment integration wired, which refuses rather than inventing an
            identifier no callback will carry. `COMMON_SERVICE_UNAVAILABLE` when entitlement state
            could not be established, so the price could not be quoted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/unlock/coin-orders/{orderId}:
    get:
      operationId: getCoinUnlockOrder
      summary: Read the state of a coin unlock order
      description: |
        Polled after `TTMinis.pay` returns. `status` moves `PENDING → PAID` when the signed callback
        confirms the payment, and `PAID → FULFILLED` when the unlock is recorded.

        `unlockGranted` is the field a client acts on, not `status`. `PAID` means the viewer was
        charged; it does not mean the episode is playable, and treating it as if it did would show a
        locked episode as unlocked. Playability comes from
        `POST /v1/entitlement/episode-access` as it always has.

        An order belonging to another viewer is reported as absent, not as forbidden.
      tags: [unlock]
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
        - name: Authorization
          in: header
          required: true
          schema:
            type: string
          description: '`Bearer <accessToken>`. Orders are readable only by the viewer who owns them.'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinUnlockOrder'
        '401':
          description: '`AUTH_REQUIRED`. No credential, or one that could not be read or resolved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `PAYMENT_ORDER_NOT_FOUND`. No such order, or it belongs to somebody else — the two are
            deliberately indistinguishable, so order ids cannot be enumerated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`COMMON_SERVICE_UNAVAILABLE`. The session could not be resolved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/progress/episodes/{episodeId}:
    parameters:
      - name: episodeId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    put:
      operationId: reportEpisodeProgress
      summary: Report a watch position
      description: |
        A heartbeat while playing, plus one report on exit. Upsert, and deliberately tolerant: a
        report that loses the last-write-wins comparison on `clientUpdatedAt` is ignored and still
        answers `204` (`docs/12-error-catalog.md` §8). An error there would teach the client to retry
        a report it is right to have dropped.

        The response has no body. Nothing useful can be said in it — the client already knows the
        position it sent — and returning the merged row would invite it to trust a value that may
        have come from another device mid-scrub.
      tags: [progress]
      security:
        - bearerSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchProgressReport'
      responses:
        '204':
          description: The report was accepted, whether or not it changed the stored position.
        '400':
          description: |
            `COMMON_VALIDATION_FAILED` for a malformed body or episode id.
            `PROGRESS_INVALID_POSITION` for a position that cannot be true of the episode it
            describes — a small overshoot is clamped to the duration, a large one is refused rather
            than clamped, because clamping would let one call mark any episode complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: '`AUTH_REQUIRED`. Progress is per-viewer; there is no anonymous reporting.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`COMMON_SERVICE_UNAVAILABLE`. The session could not be resolved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: getEpisodeProgress
      summary: Ask where to resume an episode
      description: |
        Answers `200` with a zero position for an episode the viewer never watched, rather than
        `404`: "you have never watched this" is a complete answer to "where do I resume", and a `404`
        would make every first play of every episode handle an error. `recorded` is what tells
        "never watched" apart from "watched, position 0".

        The answer is per-viewer and is sent `Cache-Control: private, no-store`.
      tags: [progress]
      security:
        - bearerSession: []
      responses:
        '200':
          description: Where to resume, and whether anything was ever reported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResumeView'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: '`AUTH_REQUIRED`. No credential, or one that could not be read or resolved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: '`COMMON_SERVICE_UNAVAILABLE`. The session could not be resolved.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/users/me/watch-history:
    get:
      operationId: listWatchHistory
      summary: List the dramas this viewer has been watching
      description: |
        One row per **drama**, sorted `watchedAt` descending and paged like every other list
        (`docs/12-api-contracts.md` §4.7). Storage is per episode, so a viewer eleven episodes into
        one drama has eleven rows; the newest row per drama is the one that appears here, because the
        alternative buries every other drama behind the one they are already deep into.

        This is the only list read in the product that is **not** anonymous-capable, and the three
        answers below are three different screens in the client. They must never be collapsed:

          - `401` — nobody is asking. The client runs silent login and retries once.
          - `200` with `items: []` — signed in, watched nothing. An empty state, not an error.
          - `503` — signed in, has watched something, and the catalogue cannot describe it. A fault,
            and never reported as an empty list: "you have never watched anything" is a claim about
            the viewer that a viewer acts on by leaving.

        A drama whose episodes the catalogue cannot describe — deleted, unpublished or withdrawn — is
        left out of the list rather than rendered with placeholder text, because its row would be a
        cover and a resume button that playback answers with `410`.

        The answer is per-viewer and is sent `Cache-Control: private, no-store`.
      tags: [progress]
      security:
        - bearerSession: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: |
            Opaque. Echo back `pageInfo.nextCursor` and never parse it. A cursor this server did not
            mint is `400`, not a silent restart from the beginning.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
          description: |
            Clamped to 50 rather than refused: a client asking for a page size we do not serve is
            asking a question we can answer. A value that is not a positive integer is `400`.
      responses:
        '200':
          description: |
            One page of history, possibly empty. An empty page is an answer about the viewer, not a
            failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchHistoryPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: |
            `AUTH_REQUIRED`. No credential, or one that could not be read or resolved. History
            belongs to a session: there is no anonymous reading of it, and an empty list is never
            the answer to a request that could not be identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: |
            `COMMON_SERVICE_UNAVAILABLE`. Either the session could not be resolved, or the viewer has
            watched something and the catalogue cannot describe it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/dramas:
    get:
      operationId: listDramas
      summary: Browse published dramas
      description: |
        Anonymous-capable, like every catalogue read (`docs/12-api-contracts.md` §2.2): browsing and
        free episodes must work before login, and silent login can fail.

        Only published dramas are served. Drafts and delisted dramas are absent from every list
        regardless of how they rank.

        Pagination is keyset, not offset: `cursor` names the last item of the previous page. A
        cursor is only valid for the query that produced it — replaying a `sort=HOT` cursor against
        `sort=NEW` is a `400` rather than a page that is quietly wrong.
      tags: [catalog]
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DramaCategory'
        - name: tag
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [HOT, NEW]
            default: HOT
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Out-of-range values are rejected rather than clamped, so a client learns.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: A page of drama summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DramaPage'
        '400':
          $ref: '#/components/responses/Error'

  /v1/dramas/{dramaId}:
    get:
      operationId: getDrama
      summary: Drama detail
      description: |
        A draft drama answers `404` and a delisted one answers `410`. The distinction is what lets a
        deep link or a history entry show "no longer available" instead of "wrong link"
        (`docs/architecture/system-overview.md` §6.2), while unannounced content stays
        indistinguishable from a typo.

        `seasons` lists published seasons only. `viewer` is `null` until favourites and watch
        progress exist — a `favorited: false` we cannot verify renders as a confirmed empty heart.
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/DramaId'
      responses:
        '200':
          description: The drama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DramaDetail'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          description: The drama was delisted. `details.resourceType` is `DRAMA`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/dramas/{dramaId}/episodes:
    get:
      operationId: listDramaEpisodes
      summary: The drama's episodes, flattened across seasons
      description: |
        One running order for the whole drama (W1B decision 10). Every item carries
        `globalEpisodeNumber`, the position within the drama, alongside the per-season
        `episodeNumber`.

        **The drama-level free window is measured in `globalEpisodeNumber`.** Measuring it in
        `episodeNumber` would give away the opening episodes of every season a drama ever ships,
        because that number restarts at 1 in each season.

        A withdrawn episode stays in the list, reported `UNAVAILABLE`, so the grid does not renumber
        itself; the episodes of a withdrawn *season* are not listed at all, and their numbers stay
        reserved.
      tags: [catalog]
      parameters:
        - $ref: '#/components/parameters/DramaId'
        - name: seasonNumber
          in: query
          required: false
          description: A season the drama does not have answers `404`, not an empty page.
          schema:
            type: integer
            minimum: 1
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: A page of episodes in global episode order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodePage'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          description: The drama was delisted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/episodes/{episodeId}:
    get:
      operationId: getEpisode
      summary: One episode, with the viewer's access to it
      tags: [catalog]
      parameters:
        - name: episodeId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The episode.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeItem'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          description: |
            The episode, its season or its drama was withdrawn. `details.resourceType` says which,
            because the three have different client recoveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/recommendations/feed:
    get:
      operationId: getRecommendationFeed
      summary: The home and player recommendation feed
      description: |
        A rule mix, not a model: continue watching, then a popularity/recency alternation
        (`docs/handoff/w1-work-b.md` decision 7). Anonymous viewers have no progress and receive the
        non-personalised remainder.

        `scene=PLAYER` carries no continue-watching card — it sits beside something already playing.

        Every card carries a `trackingId` minted for that card in that response. It is the join key
        between an impression and the click it produced, so it is never reused across responses.
      tags: [discovery]
      parameters:
        - name: scene
          in: query
          required: false
          schema:
            type: string
            enum: [HOME, PLAYER]
            default: HOME
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: A page of feed cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPage'
        '400':
          $ref: '#/components/responses/Error'

  /v1/search:
    get:
      operationId: searchDramas
      summary: Keyword search over drama titles and tags
      description: |
        Closes gap **G5** (`docs/02-information-architecture.md` §10), which is why the 剧场 tab's
        search entry exists but is hidden. Anonymous: browsing must work before login, and the
        Minis client's silent login can fail before the viewer has typed anything.

        Matching is over the title and the tags only, on a folded copy of both — case, fullwidth
        forms and Latin diacritics are folded, kana voiced marks are not. Results are ordered by
        match tier (title prefix, title substring, exact tag, partial tag), then by play count,
        then by identifier, which makes the order total and stable across requests.

        Only published dramas are returned. Unreviewed and delisted content is not discoverable
        (`docs/14-test-plan.md` §5.2, `E-13`).

        There is no cursor. Relevance order is not a keyset, so paging a ranking needs a snapshot
        of that ranking to mean anything; `truncated` says that more matched than `limit` allowed
        through, and the client's move is to narrow the query.
      tags: [discovery]
      parameters:
        - name: q
          in: query
          required: true
          description: |
            Required and non-empty. An empty query is a `400`, not an empty result set: "no results
            for nothing" is indistinguishable from a query that genuinely matched nothing, which is
            the one state the empty-result screen exists for.
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: limit
          in: query
          required: false
          description: |
            An out-of-range limit is refused rather than clamped: a client that asks for 500 and
            silently receives 50 believes it has seen every match.
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: The matches, ordered. Empty `items` is a normal answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DramaSearchResults'
        '400':
          $ref: '#/components/responses/Error'

  /v1/dramas/{dramaId}/favorite:
    parameters:
      - name: dramaId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 64
    get:
      operationId: getDramaFavorite
      summary: Whether this viewer follows this drama
      description: |
        Answers `200` with `favorited: false` when they do not — the common case, and not an error.

        The read applies no publication check: a viewer must be able to see their own row for a
        drama that has since been delisted, because that row is why the drama is still on their
        favourites screen.

        `private, no-store`: the answer is per viewer, and a shared cache holding one is a
        cross-user leak waiting for a misconfigured proxy.
      tags: [discovery]
      security:
        - bearerSession: []
      responses:
        '200':
          description: This viewer's favourite state for this drama.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: No verifiable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      operationId: addDramaFavorite
      summary: Follow a drama
      description: |
        Idempotent: a repeated `PUT` answers `204` and does **not** move `favoritedAt`. A
        double-tapped button and a retry after a network failure are the same single decision.

        This is the one operation here that consults the catalogue. Following a drama creates a
        reference to it, and a reference to something that does not exist reaches the viewer as a
        permanently broken card on their favourites screen. A drama that was never published
        answers `404` rather than `410`, so the endpoint cannot be used to confirm that an
        unannounced title exists.
      tags: [discovery]
      security:
        - bearerSession: []
      responses:
        '204':
          description: The viewer follows this drama. Empty body.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: No verifiable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            No such drama, or one that has never been published. `CONTENT_NOT_FOUND`, with
            `details.resourceType` and `details.resourceId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: |
            The drama has been delisted. `CONTENT_OFFLINE` — a viewer cannot start following
            content that is no longer served, though one who already follows it keeps the row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: removeDramaFavorite
      summary: Unfollow a drama
      description: |
        Idempotent and unconditional: `204` whether or not there was a row, and whatever the
        catalogue says about the drama. Un-following must never be the operation that fails —
        refusing it for a delisted drama would trap the row on the viewer's screen with no way to
        clear it, and a `404` for a row that is already gone makes a retried `DELETE` look like an
        error.
      tags: [discovery]
      security:
        - bearerSession: []
      responses:
        '204':
          description: The viewer does not follow this drama. Empty body.
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: No verifiable session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      operationId: login
      summary: Exchange a TikTok authorization code for a session
      description: |
        `TTMinis.login()` yields a short-lived code on the client; the exchange happens server-side
        because a browser cannot call the OpenAPI directly (CORS) and because the client secret may
        never leave the server (U-03).

        Minis launches with `TIKTOK` only. The other providers in `docs/design/api-contracts.md` §5
        are reserved for future clients and are rejected here.

        The access token is opaque and short-lived. No refresh token is issued: the Minis client
        holds the access token in memory and re-runs silent login when it expires.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A session was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: |
            The platform rejected the authorization code — expired, already spent, or issued to
            another client key. The client answers by running silent login again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: |
            The identity provider could not be reached or is not configured. `AUTH_PROVIDER_ERROR`
            is ours to fix, not the caller's, and the response does not distinguish the two cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/payments/callbacks/tiktok:
    post:
      operationId: receiveTiktokPaymentCallback
      summary: Inbound TikTok payment webhook
      description: |
        Server-to-server only; never called by a client. TikTok signs the request with
        `Tiktok-Signature: t=<epoch>,s=<hex>`, where the signed payload is
        `t + "." + <raw request body>` and the key is the client secret
        (`docs/research/tiktok-minis-official.md` §6.3).

        Verification is fail-closed and has no bypass. A request that cannot be authenticated —
        including one arriving at a deployment that holds no signing key — is rejected, and every
        verification failure answers with the same status and the same code so the endpoint cannot
        be used as an oracle.

        Delivery is at-least-once with 72 hours of retries, so a redelivery is normal traffic:
        it is deduplicated on `trade_order_id` and answered `200`. A non-200 is treated as failed
        delivery and brings the event back.

        This is the only path that can move a coin unlock order out of `PENDING`. A verified
        `minis.trade_order.redeem.success` is correlated to an order on `trade_order_id`, checked
        against the payer's open id, and recorded as paid. Recording a payment is not granting an
        episode — the unlock record is written by the wallet slot, and until it exists a paid order
        stays paid and locked.

        The raw body is stored before it is parsed and before it is verified. The envelope field set
        is documented-but-not-exhaustive (gap G-R4), so the stored bytes are what makes a historical
        event replayable once the real field list is known.
      tags: [platform-tiktok]
      parameters:
        - name: Tiktok-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^t=[0-9]+,s=[0-9a-fA-F]{64}$'
          description: Sent by TikTok. `t` is UTC epoch seconds, `s` is the HMAC-SHA256 hex digest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TiktokWebhookEnvelope'
      responses:
        '200':
          description: |
            The event was authenticated and accepted, or recognised as a redelivery. Returned
            immediately; fulfilment is not part of this response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookAck'
        '400':
          description: |
            Rejected. `PAYMENT_CALLBACK_INVALID_SIGN` covers every authenticity failure without
            distinguishing them; `COMMON_VALIDATION_FAILED` means the request was authentic but its
            envelope could not be interpreted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/Error'

components:
  schemas:
    Health:
      type: object
      required: [status, service, uptimeSec]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        uptimeSec:
          type: integer
          minimum: 0

    DramaCategory:
      type: string
      enum: [ROMANCE, REVENGE, FAMILY, SUSPENSE, COMEDY, FANTASY, OTHER]

    UnlockPolicy:
      type: string
      description: |
        The **effective** policy: the drama-level free window is already folded in, so an episode
        inside the window reports `FREE` whatever is stored against it.
      enum: [FREE, COIN, VIP_ONLY, COIN_OR_VIP]

    PageInfo:
      type: object
      required: [nextCursor, hasMore]
      description: |
        Cursor pagination, `docs/12-api-contracts.md` §2.3. `nextCursor` is opaque: clients echo it
        back and never parse it. It is `null` exactly when `hasMore` is false, so a cursor is never
        handed out that leads into an empty page.
      properties:
        nextCursor:
          type: [string, 'null']
          description: Opaque. Echoed back verbatim; non-null exactly when `hasMore` is true.
        hasMore:
          type: boolean

    DramaStat:
      type: object
      required: [playCount, favoriteCount, score]
      properties:
        playCount:
          type: integer
          minimum: 0
        favoriteCount:
          type: integer
          minimum: 0
        score:
          type: number

    DramaSummary:
      type: object
      required:
        [id, title, coverUrl, category, tags, totalEpisodes, freeEpisodes, isCompleted, stat]
      description: |
        The list-card view of a drama. It carries no episode and no playback identifier of any kind:
        those reach a client only through a playback session (correction A4,
        `docs/architecture/system-overview.md` §1.1).
      properties:
        id:
          type: string
        title:
          type: string
        coverUrl:
          type: string
          description: A poster image. The catalogue never carries a video handle of any kind.
        category:
          $ref: '#/components/schemas/DramaCategory'
        tags:
          type: array
          items:
            type: string
        totalEpisodes:
          type: integer
          minimum: 0
          description: |
            Counted over the episodes a viewer can see, so it matches the grid the client renders
            and drafts are not advertised.
        freeEpisodes:
          type: integer
          minimum: 0
          description: |
            Display copy ("first 3 free"), counted in `globalEpisodeNumber`. It is never the input
            to a playability decision — that arrives decided, in `EpisodeItem.viewerAccess`.
        isCompleted:
          type: boolean
        stat:
          $ref: '#/components/schemas/DramaStat'

    SeasonSummary:
      type: object
      required: [id, seasonNumber, title, episodeCount]
      properties:
        id:
          type: string
        seasonNumber:
          type: integer
          minimum: 1
        title:
          type: [string, 'null']
        episodeCount:
          type: integer
          minimum: 0

    DramaDetail:
      allOf:
        - $ref: '#/components/schemas/DramaSummary'
        - type: object
          required: [description, horizontalCoverUrl, seasons, viewer]
          properties:
            description:
              type: string
            horizontalCoverUrl:
              type: [string, 'null']
            seasons:
              type: array
              items:
                $ref: '#/components/schemas/SeasonSummary'
            viewer:
              type: [object, 'null']
              description: |
                `null` for an anonymous viewer, and while favourites and progress are unimplemented.
              properties:
                favorited:
                  type: boolean
                lastWatched:
                  type: [object, 'null']

    ViewerAccess:
      type: object
      required: [playable, reason, unlockedBy]
      description: |
        The server's answer to "may this viewer watch this episode". The client branches on it and
        never recomputes it: the rules live server-side only (`docs/12-domain-model.md` §3.4).

        `playable` is a statement about entitlement, not a promise of a frame. The platform enforces
        moderation, online version and listing independently and may still refuse.
      properties:
        playable:
          type: boolean
        reason:
          type: string
          enum: [FREE, UNLOCKED, VIP, NEED_UNLOCK, NEED_VIP, UNAVAILABLE]
          description: |
            `UNAVAILABLE` is not a commercial state and must not be offered an unlock: buying it
            would buy nothing.
        unlockedBy:
          type: [string, 'null']
          enum: [COIN, VIP, AD, GRANT, null]
          description: |
            How access was granted; non-null only when `reason` is `UNLOCKED`. `VIP` means the live
            subscription grants it and access ends with the subscription; `COIN`, `AD` and `GRANT`
            are durable receipts for this episode.

    EpisodeItem:
      type: object
      required:
        [
          id,
          dramaId,
          seasonId,
          seasonNumber,
          episodeNumber,
          globalEpisodeNumber,
          title,
          durationSec,
          unlockPolicy,
          priceCoins,
          viewerAccess,
        ]
      description: |
        A catalogue listing. It deliberately carries no `vid`, no asset key and no URL: playback
        identifiers are issued only by `POST /v1/playback/sessions`, which re-checks entitlement.
      properties:
        id:
          type: string
        dramaId:
          type: string
        seasonId:
          type: string
        seasonNumber:
          type: integer
          minimum: 1
        episodeNumber:
          type: integer
          minimum: 1
          description: Position within its season. Unique per season, not per drama.
        globalEpisodeNumber:
          type: integer
          minimum: 1
          description: |
            Position within the drama, across seasons. This is the number the client displays, the
            number deep links carry, and the number the free window is measured in.
        title:
          type: [string, 'null']
        durationSec:
          type: integer
          minimum: 0
        unlockPolicy:
          $ref: '#/components/schemas/UnlockPolicy'
        priceCoins:
          type: [integer, 'null']
          description: '`null` when the effective policy cannot be satisfied with coins.'
        viewerAccess:
          $ref: '#/components/schemas/ViewerAccess'

    DramaPage:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DramaSummary'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    EpisodePage:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EpisodeItem'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    FeedCard:
      type: object
      required: [cardType, drama, continueEpisode, recReason, trackingId]
      properties:
        cardType:
          type: string
          enum: [CONTINUE_WATCHING, DRAMA]
        drama:
          $ref: '#/components/schemas/DramaSummary'
        continueEpisode:
          type: [object, 'null']
          description: Present only on a `CONTINUE_WATCHING` card.
          properties:
            episodeId:
              type: string
            globalEpisodeNumber:
              type: integer
              minimum: 1
            positionSec:
              type: integer
              minimum: 0
        recReason:
          type: [string, 'null']
          description: |
            Display copy. Server-side localisation does not exist yet, so it is English; conflict C9
            (`docs/handoff/w1-p3.md` §3) requires it to follow `Accept-Language`.
        trackingId:
          type: string
          description: |
            Minted per card per response. It joins an impression to the click it produced, so it is
            never reused — two responses for the same drama carry different ones.

    FeedPage:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedCard'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    CreatePlaybackSessionRequest:
      type: object
      required: [episodeId]
      properties:
        episodeId:
          type: string
          minLength: 1

    PlaybackDescriptor:
      type: object
      required: [albumId, episodeId, vid, resumePositionSec]
      properties:
        albumId:
          type: string
        episodeId:
          type: string
        vid:
          type: string
          description: BytePlus video id, produced by the platform media-asset pipeline.
        playAuthToken:
          type: string
          description: |
            Only required by TikTok clients below 44.5.0. Short-lived; fetched lazily and never
            cached beyond its validity.
        resumePositionSec:
          type: integer
          minimum: 0

    EpisodeAccessRequest:
      type: object
      required: [episodeId]
      properties:
        episodeId:
          type: string
          minLength: 1

    EpisodeAccessResponse:
      type: object
      required: [episodeId, viewerAccess, unlockOptions, priceCoins]
      properties:
        episodeId:
          type: string
        viewerAccess:
          $ref: '#/components/schemas/ViewerAccess'
        unlockOptions:
          type: array
          description: |
            What the viewer can do about a denial, empty when the episode is playable. `AD` is
            absent until ad unlocking exists.
          items:
            type: string
            enum: [COINS, VIP]
        priceCoins:
          type: [integer, 'null']
          minimum: 1
          description: |
            The coin price, present only when paying is one of the options. A paid episode whose
            stored price is not a positive integer is answered `503` rather than quoted as free.

    CreateCoinUnlockOrderRequest:
      type: object
      required: [episodeId]
      description: |
        No price field, and no coin amount. The server quotes the price from the same entitlement
        decision that reports it to the client, so a request cannot propose what it pays.
      properties:
        episodeId:
          type: string
          minLength: 1

    CoinUnlockOrder:
      type: object
      required: [orderId, status, episodeId, priceCoins, unlockGranted, createdAt, paidAt, payment]
      properties:
        orderId:
          type: string
          description: '`uord_`-prefixed. Distinct from the `ord_` space of recharge orders.'
        status:
          type: string
          enum: [PENDING, PAID, FULFILLED]
          description: |
            `PENDING` until a verified callback confirms the payment, `PAID` once it has, and
            `FULFILLED` once the unlock record exists. Only the callback produces `PAID`.
        episodeId:
          type: string
        priceCoins:
          type: integer
          minimum: 1
          description: Quoted by the server when the order was opened, and frozen from then on.
        unlockGranted:
          type: boolean
          description: |
            Whether this order has actually bought access. The field a client acts on: `status`
            describes the payment, and a paid order whose unlock has not been recorded grants
            nothing. Playability is still decided by `POST /v1/entitlement/episode-access`.
        createdAt:
          type: string
          format: date-time
        paidAt:
          type: [string, 'null']
          format: date-time
          description: When the verified callback was received. `null` while the order is `PENDING`.
        payment:
          type: object
          required: [provider, tradeOrderId]
          description: |
            What the client hands to `TTMinis.pay`. The charge is the platform's; no amount, card or
            wallet reference passes through this API.
          properties:
            provider:
              type: string
              const: TIKTOK
            tradeOrderId:
              type: string
              description: |
                The platform's identifier for the payment, and the only field the callback is
                correlated on.

    DramaSearchHit:
      type: object
      required: [dramaId, title, tags, matchedOn]
      description: |
        What search itself knows about a match, and nothing else. Cover art, episode counts and
        statistics are `DramaSummary` fields and are deliberately not duplicated here — a second,
        partial copy of a summary is how two shapes of one drama start disagreeing. The client
        renders a title-and-tags row today; the handoff records the field (`items[].drama`) that
        folds the real summary in.
      properties:
        dramaId:
          type: string
        title:
          type: string
          description: The stored title, verbatim. Matching runs on a folded copy nobody sees.
        tags:
          type: array
          items:
            type: string
        matchedOn:
          type: string
          enum: [TITLE, TAG]
          description: |
            Which field matched. Display information — a client may label a genre hit differently
            from a title hit — and also the primary sort key, so a client that ignores it still
            receives the rows in the order this says they are in.

    DramaSearchResults:
      type: object
      required: [query, items, truncated]
      properties:
        query:
          type: string
          description: |
            The query as searched: trimmed and whitespace-collapsed, in the viewer's own casing.
            Plain text in a JSON body and never HTML — search-term echo is on the XSS list in
            `docs/14-security.md` §2 precisely because it is so often rendered as markup.
        items:
          type: array
          items:
            $ref: '#/components/schemas/DramaSearchHit'
        truncated:
          type: boolean
          description: |
            True when more dramas matched than `limit` allowed through. There is no cursor; see the
            operation description.

    FavoriteState:
      type: object
      required: [dramaId, favorited]
      properties:
        dramaId:
          type: string
        favorited:
          type: boolean
        favoritedAt:
          type: string
          format: date-time
          description: |
            Server time when the favourite was *first* recorded. Absent when `favorited` is false,
            and unchanged by a repeated `PUT`: "following since" is a fact about the viewer's
            history, not about their most recent tap.

    WatchProgressReport:
      type: object
      required: [positionSec, durationSec, clientUpdatedAt]
      description: |
        The write shape. It says `positionSec` — an observation about the past — while the read says
        `resumePositionSec`, an instruction about the future and the same key the playback descriptor
        carries.
      properties:
        positionSec:
          type: integer
          minimum: 0
          description: Whole seconds. Clamped to `durationSec`; refused if far beyond it.
        durationSec:
          type: integer
          minimum: 1
          description: |
            The duration the player loaded. Sent with every report because the completion rule, the
            clamp and the refusal are all relations between the two values, and the asset's length is
            something the player knows and we do not.
        clientUpdatedAt:
          type: string
          format: date-time
          description: |
            The client's clock when the position was observed. The last-write-wins key: two devices
            are adjudicated on this rather than on arrival order, which is a property of the network.
            A value implausibly far in the future is pulled back to server time.
        completed:
          type: boolean
          deprecated: true
          description: |
            Accepted and ignored. Completion is computed server-side from the ratio; a client that
            could set it could inflate a completion metric.

    EpisodeResumeView:
      type: object
      required: [episodeId, resumePositionSec, completed, recorded]
      properties:
        episodeId:
          type: string
        resumePositionSec:
          type: integer
          minimum: 0
          description: |
            The player's `startTime`, and the same field name as in the playback descriptor. `0` when
            nothing was ever reported.
        completed:
          type: boolean
          description: |
            Server-computed from the position/duration ratio, and sticky: a rewatch does not clear it.
        recorded:
          type: boolean
          description: |
            False when this viewer never reported a position for this episode. It exists so that
            "never watched" and "watched, position 0" are distinguishable — a continue-watching entry
            point has to tell them apart to decide whether the episode belongs in the list at all.
        durationSec:
          type: integer
          minimum: 1
          description: From the last accepted report. Absent when `recorded` is false.
        updatedAt:
          type: string
          format: date-time
          description: Server time of the last accepted report. Absent when `recorded` is false.

    WatchHistoryEntry:
      type: object
      required: [drama, lastEpisodeNumber, lastPositionSec, watchedAt, lastEpisodeId]
      properties:
        drama:
          $ref: '#/components/schemas/DramaSummary'
        lastEpisodeNumber:
          type: integer
          minimum: 1
          description: |
            Counted in `globalEpisodeNumber`, the number the client displays everywhere else. The
            per-season number would name a different episode in every season past the first.
        lastPositionSec:
          type: integer
          minimum: 0
          description: Where to resume, in whole seconds.
        watchedAt:
          type: string
          format: date-time
          description: |
            Server time of the last accepted report, and the sort key. Clients never reorder by it.
        lastEpisodeId:
          type: string
          description: |
            The episode to resume. `docs/12-api-contracts.md` §4.7 lists four fields and none of them
            can address the player — `#/play/:episodeId` takes an id, and an episode number is not
            one — so the client registered this as a contract gap
            (`docs/handoff/w3-work-m.md` §5). It is never absent: every row in this list is derived
            from a stored progress row, and that row is keyed by the episode id.

    WatchHistoryPage:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WatchHistoryEntry'
        pageInfo:
          $ref: '#/components/schemas/PageInfo'

    LoginRequest:
      type: object
      required: [provider, authCode]
      properties:
        provider:
          type: string
          enum: [TIKTOK]
        authCode:
          type: string
          minLength: 1
          description: |
            Single-use credential from `TTMinis.login()`. Never logged, never echoed, never stored.

    LoginResponse:
      type: object
      required: [accessToken, expiresInSec, openId]
      properties:
        accessToken:
          type: string
          description: Opaque and short-lived. The Minis client holds it in memory only.
        expiresInSec:
          type: integer
          minimum: 1
        openId:
          type: string
          description: |
            The TikTok user identifier and our user primary key. Stable, and scoped to the client
            key rather than to a region (U-04).

    TiktokWebhookEnvelope:
      type: object
      required: [client_key, event, create_time, user_openid, content]
      description: |
        TikTok's own envelope, in its own naming. Additional properties are permitted on purpose:
        the One Page documents `pay_type`, which appears in no public reference, so the field set is
        known to be incomplete (G-R4).
      additionalProperties: true
      properties:
        client_key:
          type: string
        event:
          type: string
          examples: [minis.trade_order.redeem.success]
        create_time:
          type: integer
          description: UTC epoch seconds.
        user_openid:
          type: string
        content:
          type: string
          description: |
            A serialised JSON *string*, not an object. Parsed separately from the envelope, so a
            `content` we cannot interpret does not invalidate a signature we already verified.

    WebhookAck:
      type: object
      required: [received, duplicate]
      properties:
        received:
          type: boolean
          const: true
        duplicate:
          type: boolean
          description: True when this delivery repeated an event already claimed.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code:
              type: string
            message:
              type: string
            traceId:
              type: string
              description: Echoed so a user report maps to a server trace.
            details:
              type: [object, 'null']
              additionalProperties: true

  securitySchemes:
    bearerSession:
      type: http
      scheme: bearer
      description: |
        The opaque session token from `POST /v1/auth/login`, as `Authorization: Bearer <token>`. It
        is not a JWT and carries no claims: the mapping from token to user is the server's, so a
        token cannot be constructed. Declared on the endpoints that are per-viewer; endpoints without
        it either serve everyone the same answer or enforce their own rule.

  parameters:
    DramaId:
      name: dramaId
      in: path
      required: true
      schema:
        type: string

  responses:
    Error:
      description: The request failed. The envelope is identical for every error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
